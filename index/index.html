<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABO PHONE - Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Kufi Arabic', sans-serif; }
        body { background: #030712; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .card { background: #0f0f12; border: 2px solid #eab308; width: 100%; max-width: 440px; border-radius: 20px; padding: 25px; box-shadow: 0 0 20px rgba(234, 179, 8, 0.2); }
        .title { text-align: center; color: #eab308; margin-bottom: 20px; font-size: 20px; font-weight: bold; }
        .field { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; background: #030712; border: 1px solid #ca8a04; color: #fde047; border-radius: 8px; outline: none; }
        .sheet-box { background: rgba(234, 179, 8, 0.1); border: 1px dashed #eab308; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-save { background: #10b981; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-save:hover { background: #059669; }
        .btn-delete:hover { background: #dc2626; }
        .status { margin-top: 15px; text-align: center; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">بەڕێوەبردنی زانیارییەکان</div>
    
    <!-- دیاریکردنی ناوی شیت -->
    <div class="field sheet-box">
        <label style="color: #fde047; font-weight: bold;">📄 ناوی شیت (Sheet Name)</label>
        <input type="text" id="sheetNameInput" value="Sheet1" placeholder="نموونە: Sheet1 یان Accounts">
    </div>

    <div class="field">
        <label>ژمارەی ئەکاونت (خانەی F)</label>
        <input type="text" id="accInput" placeholder="نموونە: 1">
    </div>
    <div class="field">
        <label>ئیمەیل (Email)</label>
        <input type="text" id="emailInput">
    </div>
    <div class="field">
        <label>پاسوۆرد (Password)</label>
        <input type="text" id="passInput">
    </div>
    <div class="field">
        <label>ژمارەی تەلەفۆن (Phone)</label>
        <input type="text" id="phoneInput">
    </div>
    <div class="field">
        <label>ڕۆژی لەدایکبوون (Birthday)</label>
        <input type="text" id="bdayInput">
    </div>
    <div class="field">
        <label>لینکی کۆد (Link)</label>
        <input type="text" id="linkInput">
    </div>

    <div class="btn-group">
        <button class="btn-save" onclick="manageData('save')">تۆمارکردن / نوێکردنەوە</button>
        <button class="btn-delete" onclick="manageData('delete')">سڕینەوە</button>
    </div>

    <div id="statusMsg" class="status"></div>
</div>

<script>
    // URL ی دیاریکراوی گۆگڵ سکرێپتەکەت
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz2EzHO7pya_o5AHxSyTVOWa5Vud6iIM4tvatbJvV9j3iB6R4_CFEg0BusRZAH0eWXhxg/exec';

    function manageData(actionType) {
        const sheetName = document.getElementById('sheetNameInput').value.trim() || 'Sheet1';
        const acc = document.getElementById('accInput').value.trim();
        const statusMsg = document.getElementById('statusMsg');

        if (!acc) {
            statusMsg.style.color = '#ef4444';
            statusMsg.innerText = 'تکایە ژمارەی ئەکاونت (خانەی F) بنووسە!';
            return;
        }

        if (actionType === 'delete' && !confirm(`دڵنیایت لە سڕینەوەی ئەم زانیارییانە لە شیتی [${sheetName}]؟`)) {
            return;
        }

        statusMsg.style.color = '#eab308';
        statusMsg.innerText = 'چاوەڕوان بە...';

        const payload = {
            action: actionType,
            sheetName: sheetName,
            account: acc,
            email: document.getElementById('emailInput').value,
            password: document.getElementById('passInput').value,
            phone: document.getElementById('phoneInput').value,
            birthday: document.getElementById('bdayInput').value,
            link: document.getElementById('linkInput').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusMsg.style.color = '#10b981';
            if (actionType === 'save') {
                statusMsg.innerText = `زانیارییەکان بە سەرکەوتوویی لە شیتی [${sheetName}] تۆمار کران/نوێکرانەوە!`;
            } else {
                statusMsg.innerText = `داواکاری سڕینەوە لە شیتی [${sheetName}] ئەنجام درا!`;
                clearInputs();
            }
        })
        .catch(err => {
            statusMsg.style.color = '#ef4444';
            statusMsg.innerText = 'کێشەیەک ڕوویدا لە پەیوەندیکردن!';
        });
    }

    function clearInputs() {
        document.getElementById('emailInput').value = '';
        document.getElementById('passInput').value = '';
        document.getElementById('phoneInput').value = '';
        document.getElementById('bdayInput').value = '';
        document.getElementById('linkInput').value = '';
    }
</script>

</body>
</html>
